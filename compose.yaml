services:
  api:
    image: goldendict-api:native
    build:
      context: ./backend
      dockerfile: Dockerfile.native
      target: native-runtime
      additional_contexts:
        goldendict-ng: ${GOLDENDICT_NG_SOURCE:-../goldendict-ng}
      args:
        GOLDENDICT_NG_DIRTY: ${GOLDENDICT_NG_DIRTY:-}
        GOLDENDICT_NG_DIFF_SHA256: ${GOLDENDICT_NG_DIFF_SHA256:-}
        GOLDENDICT_NG_REQUIRE_CLEAN: ${GOLDENDICT_NG_REQUIRE_CLEAN:-OFF}
    environment:
      GOLDENDICT_DICTIONARY_ROOTS: /dictionaries
      GOLDENDICT_CORS_ORIGINS: "http://localhost:5173,null"
      GOLDENDICT_NATIVE_INDEX_DIR: /var/lib/goldendict/indices
      GOLDENDICT_NATIVE_REQUIRED: "true"
      GOLDENDICT_NATIVE_WORKER: /usr/local/bin/goldendict-native-worker
      GOLDENDICT_RUNTIME_CATALOG_MUTATIONS: "false"
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: ${GOLDENDICT_DICTIONARY_PATH:-./dictionaries}
        target: /dictionaries
        read_only: true
      - type: volume
        source: native-indices
        target: /var/lib/goldendict/indices
    restart: unless-stopped

  api-python:
    image: goldendict-api:python
    profiles: ["python-fallback"]
    build:
      context: ./backend
      target: runtime
    environment:
      GOLDENDICT_DICTIONARY_ROOTS: /dictionaries
      GOLDENDICT_CORS_ORIGINS: "http://localhost:5173,null"
      GOLDENDICT_RUNTIME_CATALOG_MUTATIONS: "false"
    ports:
      - "8081:8080"
    volumes:
      - type: bind
        source: ${GOLDENDICT_DICTIONARY_PATH:-./dictionaries}
        target: /dictionaries
        read_only: true
    restart: unless-stopped

  demo:
    build:
      context: .
      dockerfile: demo/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:8080"
    restart: unless-stopped

volumes:
  native-indices:
