schemaVersion: 3
goldendictNg:
  repository: https://github.com/xiaoyifang/goldendict-ng
  commit: 5ad66765aa423d381025566bff990f7d8007be84
  observedVersionTag: v26.9.0_alpha.5ad66765aa
  lockFile: native/upstream.lock
  provenance:
    script: native/provenance.sh
    inputs:
      - src
      - icons
    startupFields:
      - upstreamCommit
      - upstreamDirty
      - upstreamDiffSha256
nativeBridge:
  protocol: JSON-lines worker behind the stable read-only REST gateway
  sourceManifest: native/CMakeLists.txt
  factoriesInUpstreamOrder:
    - Bgl::makeDictionaries
    - Stardict::makeDictionaries
    - Lsa::makeDictionaries
    - Dsl::makeDictionaries
    - DictdFiles::makeDictionaries
    - Xdxf::makeDictionaries
    - Sdict::makeDictionaries
    - Aard::makeDictionaries
    - ZipSounds::makeDictionaries
    - Mdx::makeDictionaries
    - Gls::makeDictionaries
    - Slob::makeDictionaries
    - Zim::makeDictionaries
    - Epwing::makeDictionaries
  supportedFormats:
    - bgl
    - stardict
    - lsa
    - dsl
    - dictd
    - xdxf
    - sdict
    - aard
    - zipsounds
    - mdx
    - gls
    - slob
    - zim
    - epwing
  adapter:
    - app/adapters/native.py
    - app/service.py
  shims:
    - native/shims
    - native/src/headless_shims.cc
  excludedProviders:
    reason: configuration-backed providers rather than local file formats
    values:
      - sound directories
      - Hunspell morphology
      - network and website dictionaries
      - programs and voice engines
      - transliterations
mappings:
  - upstream:
      - src/dict/loaddictionaries.cc
      - src/dict/dictionary.hh
      - src/dict/dictionary.cc
      - src/metadata.cc
    local:
      - native/CMakeLists.txt
      - native/src/main.cc
      - app/adapters/native.py
      - app/service.py
    behavior:
      - complete file-backed factory order and runtime format manifest
      - recursive path filters and directory/factory catalog ordering
      - canonical article lookup and prefix matching
      - cross-dictionary synonym-headword coordination before article lookup
      - per-dictionary query errors retained beside successful articles
      - deferred reader initialization
      - adjacent metadata.toml display-name and FTS overrides
      - one batched protocol lookup with concurrent selected-dictionary requests
      - binary resources and upstream dictionary icons
  - upstream:
      - src/dict/mdx.cc
      - src/dict/mdictparser.cc
    local:
      - native/cmake/prepare_mdx_source.cmake
      - native/src/resource_guard.hh
      - native/tests/resource_guard_test.cc
    behavior:
      - MDX indexing and rendering
      - MDD volumes and case-sensitive local sidecars
      - canonical containment after every MDD redirect
  - upstream:
      - src/dict/aard.cc
      - src/dict/bgl.cc
      - src/dict/dictdfiles.cc
      - src/dict/dsl.cc
      - src/dict/epwing.cc
      - src/dict/gls.cc
      - src/dict/lsa.cc
      - src/dict/sdict.cc
      - src/dict/slob.cc
      - src/dict/stardict.cc
      - src/dict/xdxf.cc
      - src/dict/zim.cc
      - src/dict/zipsounds.cc
    local:
      - native/CMakeLists.txt
      - native/src/main.cc
      - native/tests/protocol_smoke.py
    behavior:
      - original upstream format parsing, indices, HTML, resources, and matching
  - upstream:
      - resources.qrc
      - icons
      - src/common/dictionary_icon_name.cc
      - src/tiff.cc
      - src/article_netmgr.cc
    local:
      - native/src/main.cc
      - app/adapters/native.py
      - packages/frontend/src/renderer/article-document.ts
    behavior:
      - custom and format-default Dictionary::getIcon output served as PNG
      - upstream-generated MDX abbreviations and TIFF conversion
      - gico-compatible dictionary header rendering
  - upstream:
      - src/article_maker.cc
      - src/scripts/gd-builtin.js
      - src/stylesheets/article-style.css
      - src/stylesheets/article-style-print.css
      - src/stylesheets/article-style-st-*.css
    local:
      - packages/frontend
    behavior:
      - canonical article shell classes and language attributes
      - exact pinned base, print, and display-preset CSS
      - fidelity layout as the default cascade
      - URL routing, collapse/active behavior, and opaque-frame script policy
upgradeProcedure:
  - check out the candidate GoldenDict-ng commit in a clean worktree
  - update native/upstream.lock and the frontend compatibility manifest only after review
  - build through native/build.sh so all worker inputs and provenance are attested
  - resolve factory, selected-source, shim, Qt, EB, ZIM, Vorbis, and compression-library drift explicitly
  - assert the complete supportedFormats ready contract and compile every factory
  - run representative fixtures for every available format and companion-resource form
  - verify batched lookup, prefix suggestions, native icons, and resource containment
  - run the immutable REST contract, MIME/cache/traversal, lifecycle, and health tests
  - run frontend checksum, unit, type, production-build, and real-browser fidelity gates
  - record runtime dependency and image-size changes with the lock/source/shim update
